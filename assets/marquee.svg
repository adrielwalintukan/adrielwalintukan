<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
<title>Let's build something</title>
<style>@font-face{font-family:'Big Shoulders Display';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
.d{font-family:'Big Shoulders Display';font-weight:900;text-transform:uppercase}
.s{font-family:Geist;font-weight:400}.s5{font-family:Geist;font-weight:500}
.m{font-family:'JetBrains Mono';font-weight:500;text-transform:uppercase;letter-spacing:.12em}
.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.fade{animation:fade .8s ease both}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise,.fade{animation:none}}
.track{animation:scroll 14s linear infinite}
@keyframes scroll{to{transform:translateX(-760px)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}}</style>
<clipPath id="band"><rect width="1200" height="120" rx="18"/></clipPath>
<g clip-path="url(#band)"><rect width="1200" height="120" fill="#ff3344"/>

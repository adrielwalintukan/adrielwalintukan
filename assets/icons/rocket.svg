<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="rocketCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="flameGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb142" />
      <stop offset="50%" stop-color="#ff5252" />
      <stop offset="100%" stop-color="#ff1744" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatRocket {
        0%, 100% {
          transform: translate(0px, 0px);
        }
        50% {
          transform: translate(3px, -4px);
        }
      }
      @keyframes exhaustPulse {
        0%, 100% {
          transform: translate(0, 0) scale(0.85);
          opacity: 0.7;
        }
        50% {
          transform: translate(-2px, 3px) scale(1.2);
          opacity: 1;
        }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      .rocket-body {
        animation: floatRocket 2.4s ease-in-out infinite;
        transform-origin: center;
      }
      .exhaust-flame {
        animation: exhaustPulse 0.5s ease-in-out infinite;
        transform-origin: 32px 68px;
      }
      .star-1 {
        animation: starTwinkle 1.8s ease-in-out infinite;
        transform-origin: 20px 25px;
      }
      .star-2 {
        animation: starTwinkle 2.2s ease-in-out infinite 0.7s;
        transform-origin: 82px 75px;
      }
    </style>
  </defs>

  <!-- Background Tiny Cyber Stars -->
  <circle class="star-1" cx="20" cy="25" r="2" fill="#00f0ff" filter="url(#neonGlow)" />
  <circle class="star-2" cx="82" cy="75" r="2.5" fill="#a855f7" filter="url(#neonGlow)" />

  <g class="rocket-body" filter="url(#neonGlow)">
    <!-- Animated Exhaust Flame -->
    <path class="exhaust-flame" d="M 28 64 Q 20 76 15 85 Q 28 80 36 72 Z" fill="url(#flameGrad)" />
    <path class="exhaust-flame" d="M 29 67 Q 24 76 21 82 Q 30 78 33 71 Z" fill="#ffeb3b" style="animation-duration: 0.35s;" />

    <!-- Left Fin -->
    <path d="M 33 55 L 20 66 Q 24 53 36 47 Z" fill="#0077b6" stroke="#00f0ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Right Fin -->
    <path d="M 55 33 L 66 20 Q 53 24 47 36 Z" fill="#0077b6" stroke="#00f0ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Center Stabilizer Fin -->
    <path d="M 36 64 L 43 57 L 57 43 L 64 36" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Main Rocket Hull -->
    <path d="M 32 68 C 30 52 40 32 75 15 C 68 45 48 70 32 68 Z" fill="#0b1728" stroke="url(#rocketCyan)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Rocket Nose Tip Accent -->
    <path d="M 68 21 C 71 18 73 16 75 15 C 74 17 72 19 69 22 Z" fill="#00f0ff" stroke="#00f0ff" stroke-width="2" />

    <!-- Porthole Outer Ring -->
    <circle cx="52" cy="38" r="8" fill="#07101e" stroke="#00f0ff" stroke-width="3" />
    <!-- Porthole Glass -->
    <circle cx="52" cy="38" r="4.5" fill="#00f0ff" opacity="0.9" />
  </g>
</svg>

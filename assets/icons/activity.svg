<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="neonFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#ff7700" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="innerFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes flicker {
        0%, 100% {
          transform: scale(1) translateY(0);
          opacity: 0.95;
        }
        25% {
          transform: scale(1.04, 0.96) translateY(-2px);
          opacity: 1;
        }
        50% {
          transform: scale(0.97, 1.05) translateY(-3px);
          opacity: 0.9;
        }
        75% {
          transform: scale(1.03, 0.98) translateY(-1px);
          opacity: 1;
        }
      }
      @keyframes sparkFloat {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-30px) scale(0.2); opacity: 0; }
      }

      .flame-outer {
        animation: flicker 1.8s ease-in-out infinite;
        transform-origin: 50px 85px;
      }
      .flame-inner {
        animation: flicker 1.2s ease-in-out infinite reverse;
        transform-origin: 50px 85px;
      }
      .spark-1 {
        animation: sparkFloat 1.5s ease-out infinite;
        transform-origin: 45px 35px;
      }
      .spark-2 {
        animation: sparkFloat 1.9s ease-out infinite 0.7s;
        transform-origin: 58px 30px;
      }
    </style>
  </defs>

  <!-- Animated Neon Sparks -->
  <circle class="spark-1" cx="42" cy="30" r="2" fill="#00f0ff" filter="url(#flameGlow)" />
  <circle class="spark-2" cx="58" cy="25" r="2.5" fill="#ffaa00" filter="url(#flameGlow)" />

  <!-- Outer Neon Flame -->
  <path class="flame-outer" d="M 50 15 C 56 26 66 36 72 48 C 80 62 76 80 62 86 C 54 90 40 90 32 84 C 20 74 22 55 32 44 C 36 39 36 34 35 28 C 42 32 47 38 48 45 C 50 36 48 24 50 15 Z" fill="#0c1322" stroke="url(#neonFlame)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" filter="url(#flameGlow)" />

  <!-- Inner Core Flame -->
  <path class="flame-inner" d="M 50 42 C 54 50 62 58 60 68 C 58 76 44 80 38 72 C 34 66 38 56 44 52 C 45 47 48 44 50 42 Z" fill="#ffaa00" fill-opacity="0.3" stroke="url(#innerFlame)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#flameGlow)" />
</svg>

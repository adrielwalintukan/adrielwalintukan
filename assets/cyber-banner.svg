<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Card Clip Path to prevent glow overflow -->
    <clipPath id="cardClip">
      <rect width="1000" height="320" rx="20" />
    </clipPath>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#090e1a" />
    </linearGradient>

    <linearGradient id="cyberText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="pulseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="0" r="1.5" fill="#00f0ff" fill-opacity="0.25" />
    </pattern>

    <style>
      @keyframes rotateCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateCCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes blinkFast {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes scanline {
        0% { transform: translateY(-320px); }
        100% { transform: translateY(320px); }
      }
      @keyframes beamMove {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(700px); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .rot-cw {
        transform-origin: 130px 160px;
        animation: rotateCW 24s linear infinite;
      }
      .rot-ccw {
        transform-origin: 130px 160px;
        animation: rotateCCW 18s linear infinite;
      }
      .rot-fast {
        transform-origin: 130px 160px;
        animation: rotateCW 10s linear infinite;
      }
      .core-pulse {
        transform-origin: 130px 160px;
        animation: pulseGlow 3s ease-in-out infinite;
      }
      .live-blink {
        animation: blinkFast 1.5s ease-in-out infinite;
      }
      .hud-float {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .beam-pulse {
        animation: beamMove 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Fira Code', monospace;
      }
      .sans-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
        font-weight: 900;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Enclosed Inside Rounded Card -->
  <g clip-path="url(#cardClip)">
    <!-- Base Card -->
    <rect width="1000" height="320" fill="url(#bgGrad)" />

    <!-- Grid overlay -->
    <rect width="1000" height="320" fill="url(#cyberGrid)" />

    <!-- Ambient Glow Orbs -->
    <circle cx="130" cy="160" r="120" fill="#00f0ff" fill-opacity="0.08" filter="url(#glowCyan)" />
    <circle cx="850" cy="80" r="130" fill="#a855f7" fill-opacity="0.07" filter="url(#glowCyan)" />
    <circle cx="500" cy="280" r="100" fill="#38bdf8" fill-opacity="0.05" filter="url(#glowCyan)" />

    <!-- Scanning Line Beam -->
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.15" style="animation: scanline 6s linear infinite;" />

    <!-- ==================== LEFT: HOLOGRAPHIC AI NEURAL CORE ==================== -->
    <g class="hud-float">
      <!-- Outer Orbit Ring with Ticks -->
      <circle cx="130" cy="160" r="88" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 8" />
      
      <!-- Rotating Dashed Ring -->
      <circle class="rot-cw" cx="130" cy="160" r="76" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="14 26 38 12" stroke-opacity="0.75" filter="url(#glowSoft)" />
      
      <!-- Counter-rotating Segment Ring -->
      <circle class="rot-ccw" cx="130" cy="160" r="62" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="28 18 8 18" stroke-opacity="0.65" />
      
      <!-- Fast Small Radar Ring -->
      <circle class="rot-fast" cx="130" cy="160" r="48" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 30" stroke-opacity="0.8" />

      <!-- Radar Crosshair Ticks -->
      <line x1="130" y1="64" x2="130" y2="78" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8" />
      <line x1="130" y1="242" x2="130" y2="256" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8" />
      <line x1="34" y1="160" x2="48" y2="160" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8" />
      <line x1="212" y1="160" x2="226" y2="160" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.8" />

      <!-- Core Glowing Hexagon / AI Brain Symbol -->
      <g class="core-pulse">
        <!-- Hexagon Backplate -->
        <polygon points="130,132 154,146 154,174 130,188 106,174 106,146" fill="#0d1829" stroke="#00f0ff" stroke-width="2" filter="url(#glowSoft)" />
        
        <!-- Internal Circuit Nodes -->
        <circle cx="130" cy="160" r="7" fill="#00f0ff" filter="url(#glowCyan)" />
        <line x1="130" y1="140" x2="130" y2="153" stroke="#00f0ff" stroke-width="2" />
        <line x1="130" y1="167" x2="130" y2="180" stroke="#00f0ff" stroke-width="2" />
        <line x1="113" y1="150" x2="124" y2="156" stroke="#00f0ff" stroke-width="2" />
        <line x1="147" y1="170" x2="136" y2="164" stroke="#00f0ff" stroke-width="2" />
        <line x1="113" y1="170" x2="124" y2="164" stroke="#00f0ff" stroke-width="2" />
        <line x1="147" y1="150" x2="136" y2="156" stroke="#00f0ff" stroke-width="2" />

        <!-- Synapse dots -->
        <circle cx="130" cy="140" r="2.5" fill="#ffffff" />
        <circle cx="130" cy="180" r="2.5" fill="#ffffff" />
        <circle cx="113" cy="150" r="2.5" fill="#a855f7" />
        <circle cx="147" cy="170" r="2.5" fill="#a855f7" />
        <circle cx="113" cy="170" r="2.5" fill="#38bdf8" />
        <circle cx="147" cy="150" r="2.5" fill="#38bdf8" />
      </g>

      <!-- Subtext under Core -->
      <text class="mono-text" x="130" y="274" fill="#64748b" font-size="11" text-anchor="middle" letter-spacing="3">AI CORE // 2.0</text>
    </g>

    <!-- Vertical Divider with Neon Accents -->
    <line x1="250" y1="40" x2="250" y2="280" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="250" cy="80" r="3" fill="#00f0ff" />
    <circle cx="250" cy="240" r="3" fill="#a855f7" />

    <!-- ==================== RIGHT: IDENTITY & TELEMETRY ==================== -->

    <!-- Top System Telemetry Bar -->
    <g transform="translate(275, 48)">
      <circle class="live-blink" cx="8" cy="7" r="5" fill="#10b981" filter="url(#glowSoft)" />
      <text class="mono-text" x="22" y="11" fill="#10b981" font-size="12" font-weight="700" letter-spacing="1.5">SYS: ONLINE</text>
      
      <text class="mono-text" x="135" y="11" fill="#475569" font-size="12">|</text>
      
      <text class="mono-text" x="155" y="11" fill="#94a3b8" font-size="12" letter-spacing="1">FULLSTACK &amp; AI INTEGRATION ARCHITECT</text>
      
      <rect x="580" y="-3" width="105" height="20" rx="4" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text class="mono-text" x="632" y="11" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">UNKLAB // ID</text>
    </g>

    <!-- Main Hero Name -->
    <g transform="translate(275, 115)">
      <text class="sans-title" x="0" y="0" fill="url(#cyberText)" font-size="44" filter="url(#glowSoft)">ADRIEL WALINTUKAN</text>
    </g>

    <!-- Dynamic Role / Tagline -->
    <g transform="translate(275, 148)">
      <text class="mono-text" x="0" y="0" fill="#00f0ff" font-size="16" font-weight="600" letter-spacing="1">&gt; Crafting High-Impact Digital Solutions &amp; AI Systems</text>
    </g>

    <!-- Glowing Animated Pulse Line -->
    <g transform="translate(275, 168)">
      <line x1="0" y1="0" x2="685" y2="0" stroke="#1e293b" stroke-width="2" />
      <rect class="beam-pulse" x="0" y="-1.5" width="160" height="3" fill="url(#pulseLine)" />
    </g>

    <!-- Holographic Badges Row -->
    <g transform="translate(275, 195)">
      <!-- Badge 1: Award -->
      <g transform="translate(0, 0)">
        <rect width="265" height="36" rx="8" fill="#171506" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="18" cy="18" r="7" fill="#fbbf24" fill-opacity="0.2" />
        <text x="18" y="22" font-size="11" text-anchor="middle">🏆</text>
        <text class="mono-text" x="34" y="22" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="0.5">PROXO CORIS 2026 WINNER</text>
      </g>

      <!-- Badge 2: Internship -->
      <g transform="translate(278, 0)">
        <rect width="215" height="36" rx="8" fill="#0b1726" fill-opacity="0.85" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="18" cy="18" r="7" fill="#38bdf8" fill-opacity="0.2" />
        <text x="18" y="22" font-size="11" text-anchor="middle">💼</text>
        <text class="mono-text" x="34" y="22" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5">LLDIKTI XVI INTERN</text>
      </g>

      <!-- Badge 3: Academic -->
      <g transform="translate(506, 0)">
        <rect width="180" height="36" rx="8" fill="#170d24" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8" />
        <circle cx="18" cy="18" r="7" fill="#c084fc" fill-opacity="0.2" />
        <text x="18" y="22" font-size="11" text-anchor="middle">🎓</text>
        <text class="mono-text" x="34" y="22" fill="#c084fc" font-size="11" font-weight="700" letter-spacing="0.5">UNKLAB (2023-2027)</text>
      </g>
    </g>

    <!-- Bottom Console Status Line -->
    <g transform="translate(275, 272)">
      <rect width="686" height="30" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text class="mono-text" x="14" y="19" fill="#22c55e" font-size="12" font-weight="700">$</text>
      <text class="mono-text" x="30" y="19" fill="#94a3b8" font-size="11">stack --load </text>
      <text class="mono-text" x="120" y="19" fill="#38bdf8" font-size="11" font-weight="600">[TypeScript, Python, React Native, Next.js, Laravel, Supabase]</text>
      <circle class="live-blink" cx="666" cy="15" r="4" fill="#00f0ff" />
    </g>
  </g>

  <!-- Card Border Stroke -->
  <rect width="1000" height="320" rx="20" fill="none" stroke="#1e293b" stroke-width="1.5" />
</svg>
